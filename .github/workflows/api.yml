name: API CI

on:
  pull_request:
    paths:
      - '.github/workflows/api.yml'
      - '.dockerignore'
      - '.nvmrc'
      - 'apps/api/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/ai-client/**'
      - 'packages/shared/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/api.yml'
      - '.dockerignore'
      - '.nvmrc'
      - 'apps/api/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/ai-client/**'
      - 'packages/shared/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint:ci -w @matchbox/api -w @matchbox/shared
      - name: Typecheck
        run: npm run typecheck -w @matchbox/api -w @matchbox/shared
      - name: Unit tests
        run: npm test -w @matchbox/api
      - name: End-to-end tests
        run: npm run test:e2e -w @matchbox/api
      - name: Build
        run: npm run build -w @matchbox/api

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag matchbox-api:ci .

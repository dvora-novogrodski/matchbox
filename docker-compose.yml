# Local full stack. Service Dockerfiles are added as each deployable is implemented (M0).
# Usage: cp .env.example .env && docker compose up
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchbox}
      POSTGRES_DB: ${POSTGRES_DB:-matchbox}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchbox}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # api:

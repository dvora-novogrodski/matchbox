# Local full stack. Usage: cp .env.example .env && docker compose up --build
x-database-url: &database-url postgresql://${POSTGRES_USER:-matchbox}:${POSTGRES_PASSWORD:-matchbox}@db:5432/${POSTGRES_DB:-matchbox}

services:
  firebase-auth:
    build:
      context: .
      dockerfile: infra/docker/firebase-auth/Dockerfile
    command:
      [
        "firebase",
        "emulators:start",
        "--only",
        "auth",
        "--project",
        "${FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-demo-matchbox}}",
      ]
    ports: ["9099:9099"]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchbox}
      POSTGRES_DB: ${POSTGRES_DB:-matchbox}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchbox}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API image never runs migrations (they would repeat on every cold start), so compose applies them first.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: *database-url
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-demo-matchbox}}
      # Wins over an empty CHROME_PATH in .env so the image Chromium is used.
      CHROME_PATH: /usr/bin/chromium
    depends_on:
      firebase-auth: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    ports: ["3000:3000"]
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1, and the API listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai:
    build: { context: services/ai }
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [{ path: .env, required: false }]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: { context: services/ai }
    command: ["uvicorn", "app.worker.main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: [{ path: .env, required: false }]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8001:8001"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Baked in at build time; the browser on the host reaches the API through the published port.
      args:
        VITE_API_URL: "http://localhost:3000"
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-demo-api-key}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-demo-matchbox.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-${FIREBASE_PROJECT_ID:-demo-matchbox}}
        VITE_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
    depends_on:
      firebase-auth: { condition: service_started }
    ports: ["5173:80"]

  # Optional local LLM: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:

  #   command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
  #   env_file: .env
  #   depends_on: { db: { condition: service_healthy } }
  #   ports: ["8000:8000"]

  # worker:
  #   build: { context: services/ai, dockerfile: Dockerfile }
  #   command: uvicorn app.worker.main:app --host 0.0.0.0 --port 8001
  #   env_file: .env
  #   depends_on: { db: { condition: service_healthy } }
  #   ports: ["8001:8001"]

  # web:
  #   build: { context: ., dockerfile: apps/web/Dockerfile }
  #   env_file: .env
  #   ports: ["5173:80"]

  # Optional local LLM: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
